<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SHIVALIN ERP</title>
<style>
:root{--bg:#f3f5f9;--sf:#fff;--tx:#0f1d3a;--mu:#64708a;--bd:#e0e5ee;--ac:#0b6bcb;--ac2:#e6f1fc;--rd:#c0392b;--gn:#14804a;--am:#b9770e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1424;--sf:#161e33;--tx:#e8edf7;--mu:#93a0bb;--bd:#27314b;--ac:#4aa3ff;--ac2:#14284a;--rd:#ff7b6b;--gn:#4cc98a;--am:#f0b35a}}
:root[data-theme=dark]{--bg:#0e1424;--sf:#161e33;--tx:#e8edf7;--mu:#93a0bb;--bd:#27314b;--ac:#4aa3ff;--ac2:#14284a;--rd:#ff7b6b;--gn:#4cc98a;--am:#f0b35a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*{box-sizing:border-box}
body{margin:0;height:100%;display:flex;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#side{width:210px;background:var(--sf);border-right:1px solid var(--bd);padding:12px 8px;overflow:auto;flex:none}
#side h1{font-size:17px;margin:4px 8px 12px;color:var(--ac);letter-spacing:.5px}#side h1 small{display:block;color:var(--mu);font-size:11px;font-weight:400;letter-spacing:0}
#nav a{display:block;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--tx)}#nav a:hover{background:var(--bg)}#nav a.on{background:var(--ac2);color:var(--ac);font-weight:600}
#v{flex:1;padding:16px;overflow:auto;min-width:0}h2{margin:0 0 12px;font-size:20px}h3{margin:0 0 8px;font-size:15px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.grid .card{margin:0}.kv{font-size:21px;font-weight:700}.mu{color:var(--mu);font-size:12px}
.g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:start}
input,select,textarea{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:7px 9px;font:inherit;width:100%;margin:2px 0 8px}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.r>*{flex:1;min-width:110px}label{font-size:12px;color:var(--mu)}
button{background:var(--ac);color:#fff;border:0;border-radius:7px;padding:7px 12px;font:inherit;cursor:pointer}button.b2{background:var(--ac2);color:var(--ac)}button.bd{background:var(--rd)}button.sm{padding:3px 8px;font-size:12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{font-size:12px;color:var(--mu);font-weight:600}
td.z{color:var(--rd);font-weight:700}td.l{color:var(--am);font-weight:700}td.c{cursor:pointer;text-align:center}td.c:hover{background:var(--ac2)}
.br{display:grid;grid-template-columns:110px 1fr 50px;gap:6px;align-items:center;margin:4px 0}.br i{height:8px;background:var(--ac);border-radius:4px}.br b{text-align:right}
.hit{padding:6px 8px;border:1px solid var(--bd);border-radius:7px;margin:3px 0;cursor:pointer;display:flex;justify-content:space-between}.hit:hover{background:var(--ac2)}
.mb{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:9}.mb .card{max-width:640px;width:100%;margin:0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;display:none;z-index:99}
.lb{border:1px dashed #888;padding:2px;overflow:hidden;text-align:center;font-size:9px;line-height:1.15;background:#fff;color:#000}.lb svg{max-width:100%}
#pr{display:none}.inv{background:#fff;color:#000;padding:10px;font-size:12px}.inv table th,.inv table td{color:#000}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important}}
@media(max-width:800px){body{flex-direction:column}#side{width:100%;display:flex;overflow-x:auto;gap:4px;padding:6px;align-items:center}#side h1{margin:0 8px 0 0;white-space:nowrap}#side h1 small{display:none}#nav{display:flex;gap:4px}#nav a{white-space:nowrap}.g2{grid-template-columns:1fr}}
</style></head><body>
<div id="side"><h1>SHIVALIN<small>Footwear ERP &amp; POS</small></h1><div id="nav"></div></div><div id="v"></div><div id="md"></div><div id="toast"></div><div id="pr"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script>
const K='shivalin_erp_v1';let D=null;
const blank=()=>({products:[],variants:[],sales:[],returns:[],customers:[],suppliers:[],purchases:[],ledger:[],sledger:[],expenses:[],moves:[],inv:0,demo:0,ver:2,shop:{name:'SHIVALIN Footwear',addr:'Vadodara, Gujarat',gstin:''}});
try{D=JSON.parse(localStorage.getItem(K))}catch(e){}D=D||blank();migrate(D);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){toast('Storage unavailable - not saved',1)}};
const $=s=>document.querySelector(s),fm=n=>'₹'+(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),id=()=>Math.random().toString(36).slice(2,9),td=()=>new Date().toISOString().slice(0,10),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const V=s=>D.variants.find(v=>v.sku===s),P=i=>D.products.find(p=>p.id===i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cbal=i=>sum(D.ledger.filter(l=>l.cid===i),l=>l.amt),sbal=i=>sum(D.sledger.filter(l=>l.sid===i),l=>l.amt),num=(a,b)=>parseFloat(a)-parseFloat(b);
function toast(m,e){const t=$('#toast');t.textContent=m;t.style.background=e?'var(--rd)':'var(--tx)';t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2800)}
const modal=h=>$('#md').innerHTML=`<div class=mb><div class=card>${h}<div style="text-align:right;margin-top:8px"><button class=b2 onclick=cm()>Close</button></div></div></div>`,cm=()=>$('#md').innerHTML='';
const tb=(h,r)=>`<div class=tw><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.length?r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan=${h.length} class=mu>No records yet</td></tr>`}</table></div>`;
function mv(sku,d,why,ref){const v=V(sku);v.qty+=d;D.moves.unshift({d:new Date().toLocaleString('en-IN'),sku,delta:d,why,ref,bal:v.qty});if(D.moves.length>500)D.moves.pop()}
const CATS=['Men\'s Shoes','Women\'s Shoes','Kids\' Shoes','Sports Shoes','Casual Shoes','Formal Shoes','School Shoes','Sneakers','Sandals','Slippers / Chappals','Flip-Flops','Heels','Flats','Boots','Socks & Accessories'];
const NAV=[['dash','Dashboard'],['pos','POS Billing'],['sales','Sales & Returns'],['prod','Products'],['stock','Stock Matrix'],['buy','Purchases & Suppliers'],['cust','Customers'],['lbl','Barcode Labels'],['exp','Expenses'],['rep','Reports'],['set','Settings & Backup']];
let cur='dash';const go=x=>{cur=x;render()};
function render(){$('#nav').innerHTML=NAV.map(n=>`<a class="${n[0]===cur?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('');$('#v').innerHTML=VW[cur]();if(H[cur])H[cur]()}
const opt=(a,sel)=>a.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
const VW={},H={};
/* DASHBOARD */
VW.dash=()=>{const t=td(),m=t.slice(0,7),S=D.sales,rs=a=>sum(D.returns.filter(x=>x.date.startsWith(a)),x=>x.repl-x.refund),ts=S.filter(s=>s.date===t),ms=S.filter(s=>s.date.startsWith(m));
const by=(f,g)=>{const o={};S.forEach(s=>s.lines.forEach(l=>{const k=f(l);o[k]=(o[k]||0)+g(l)}));return o};
const bars=o=>{const e=Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=e[0]?e[0][1]:1;return e.length?e.map(([k,v])=>`<div class=br><span>${esc(k)}</span><i style="width:${Math.max(4,v/mx*100)}%"></i><b>${v}</b></div>`).join(''):'<p class=mu>No sales yet</p>'};
const pay={};S.forEach(s=>s.pays.forEach(p=>pay[p.m]=(pay[p.m]||0)+p.a));
const K=(l,v,s)=>`<div class=card><div class=mu>${l}</div><div class=kv>${v}</div><div class=mu>${s||''}</div></div>`,low=D.variants.filter(v=>v.qty>0&&v.qty<=2).length;
return `<h2>Dashboard</h2>${D.products.length?'':`<div class=card><b>Welcome to SHIVALIN ERP.</b> Add products, or <button class=sm onclick=demo()>load demo data</button> (clearly marked demo records).</div>`}
<div class=grid>${K('Today net sales',fm(sum(ts,s=>s.total)+rs(t)),ts.length+' bills')}${K('Month net sales',fm(sum(ms,s=>s.total)+rs(m)),'after exchanges')}${K('Est. gross profit (month)',fm(sum(ms,s=>s.profit)),'ex-GST')}${K('Items sold today',sum(ts,s=>sum(s.lines,l=>l.qty)))}${K('Inventory value (cost)',fm(sum(D.variants,v=>v.qty*P(v.pid).cost)),D.products.length+' articles / '+D.variants.length+' variants')}${K('Low / out of stock',low+' / '+D.variants.filter(v=>v.qty<=0).length,'variants')}${K('Customer dues',fm(sum(D.customers,c=>cbal(c.id))))}${K('Supplier dues',fm(sum(D.suppliers,s=>sbal(s.id))))}${K('Expenses (month)',fm(sum(D.expenses.filter(e=>e.date.startsWith(m)),e=>e.amt)))}</div><div style="height:12px"></div>
<div class=g2><div class=card><h3>Top articles (pairs)</h3>${bars(by(l=>l.code+' '+l.name,l=>l.qty))}</div><div class=card><h3>Best sizes</h3>${bars(by(l=>'Size '+l.size,l=>l.qty))}</div><div class=card><h3>Best colors</h3>${bars(by(l=>l.color,l=>l.qty))}</div><div class=card><h3>Cash collected by method</h3>${Object.keys(pay).length?tb(['Method','Amount'],Object.entries(pay).map(([k,v])=>[k,fm(v)])):'<p class=mu>No payments yet</p>'}</div></div>`};
/* PRODUCTS */
VW.prod=()=>`<h2>Products & Articles</h2><div class=card><button onclick="pf()">+ Add article / variants</button></div>${tb(['Article','Name','Category','Brand','Cost','Price','GST','Variants','Stock',''],D.products.map(p=>{const vs=D.variants.filter(v=>v.pid===p.id);return[esc(p.code),esc(p.name),esc(p.cat),esc(p.brand),fm(p.cost),fm(p.price),p.gst+'%',vs.length,sum(vs,v=>v.qty),`<button class="sm b2" onclick="pf('${p.id}')">Edit</button>`]}))}`;
function pf(pid){const p=pid?P(pid):{},vs=pid?D.variants.filter(v=>v.pid===pid):[],u=k=>[...new Set(vs.map(v=>v[k]))].join(', ');
const f=(k,l,v='',t='text')=>`<div><label>${l}</label><input id=f_${k} type=${t} value="${esc(v)}" ${k==='code'&&pid?'readonly':''}></div>`;
modal(`<h3>${pid?'Edit':'New'} article</h3><div class=r>${f('code','Article code *',p.code)}${f('name','Product name *',p.name)}</div><div class=r><div><label>Category</label><select id=f_cat>${opt(CATS,p.cat)}</select></div>${f('brand','Brand',p.brand)}</div><div class=r>${f('cost','Purchase price *',p.cost,'number')}${f('price','Selling price (GST incl.) *',p.price,'number')}${f('mrp','MRP',p.mrp,'number')}<div><label>GST %</label><select id=f_gst>${opt(['0','5','12','18'],String(p.gst??5))}</select></div></div>${f('colors','Colors (comma separated)',pid?u('color'):'',)}${f('sizes','Sizes (comma separated, e.g. 6,7,8,9,10)',pid?u('size'):'')}<p class=mu>Each color + size gets its own SKU, barcode and stock. Existing variants are never duplicated.</p><button onclick=sp()>Save</button>`)}
function sp(){const g=k=>$('#f_'+k).value.trim(),o={code:g('code'),name:g('name'),cat:g('cat'),brand:g('brand'),cost:g('cost'),price:g('price'),mrp:g('mrp')||g('price'),gst:g('gst'),colors:g('colors').split(',').map(x=>x.trim()).filter(Boolean),sizes:g('sizes').split(',').map(x=>x.trim()).filter(Boolean)};
if(!o.code||!o.name||!(+o.price>0)||!(+o.cost>=0)||g('cost')==='')return toast('Code, name, cost and selling price are required',1);if(!o.colors.length||!o.sizes.length)return toast('Enter at least one color and size',1);
const n=mk(o);save();cm();toast(n+' new variant(s) created');render()}
function mk(o){let p=D.products.find(x=>x.code.toLowerCase()===o.code.toLowerCase());const d={name:o.name,cat:o.cat,brand:o.brand,cost:+o.cost,price:+o.price,mrp:+o.mrp,gst:+o.gst};
if(p)Object.assign(p,d);else{p={id:id(),code:o.code,...d};D.products.push(p)}let n=0;
o.colors.forEach(c=>o.sizes.forEach(s=>{const sku=`${p.code}-${c.replace(/\s/g,'').toUpperCase()}-${s}`;if(!V(sku)){D.variants.push({sku,pid:p.id,color:c,size:String(s),qty:0});n++}}));return n}
/* STOCK */
let SP='';
VW.stock=()=>{const p=P(SP)||D.products[0];if(!p)return'<h2>Stock Matrix</h2><div class=card>Add a product first.</div>';SP=p.id;const vs=D.variants.filter(v=>v.pid===p.id),sz=[...new Set(vs.map(v=>v.size))].sort(num),cl=[...new Set(vs.map(v=>v.color))];
return `<h2>Stock Matrix (article × color × size)</h2><div class=card><label>Article</label><select onchange="SP=this.value;render()">${D.products.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.code+' - '+x.name)}</option>`).join('')}</select><p class=mu>Click a cell to adjust stock (reason required). Red = out, amber = low (≤2).</p>
${tb(['Color \\ Size',...sz,'Total'],cl.map(c=>[`<b>${esc(c)}</b>`,...sz.map(s=>{const v=vs.find(x=>x.color===c&&x.size===s);return v?`<span onclick="adj('${esc(v.sku)}')" style="cursor:pointer;display:block;font-weight:700;color:${v.qty<=0?'var(--rd)':v.qty<=2?'var(--am)':'inherit'}">${v.qty}</span>`:'-'}),sum(vs.filter(v=>v.color===c),v=>v.qty)]))}</div>
<div class=card><h3>Inventory movement history</h3>${tb(['When','SKU','Change','Balance','Reason','Ref'],D.moves.slice(0,40).map(m=>[m.d,esc(m.sku),`<b style="color:var(${m.delta<0?'--rd':'--gn'})">${m.delta>0?'+':''}${m.delta}</b>`,m.bal,esc(m.why),esc(m.ref||'')]))}</div>`};
function adj(sku){modal(`<h3>Adjust ${esc(sku)}</h3><p class=mu>Current stock: ${V(sku).qty}</p><label>Change (+/-)</label><input id=ad type=number><label>Reason *</label><input id=ar placeholder="Damaged, recount, found…"><button onclick="sa('${esc(sku)}')">Apply</button>`)}
function sa(sku){const d=parseInt($('#ad').value),r=$('#ar').value.trim();if(!d||!r)return toast('Enter change and reason',1);if(V(sku).qty+d<0)return toast('Stock cannot go negative',1);mv(sku,d,'Adjustment: '+r,'MANUAL');save();cm();render()}
/* POS */
let C={cart:[],disc:0},busy=0;
VW.pos=()=>`<h2>POS Billing</h2><div class=g2><div><div class=card><input id=q placeholder="Scan barcode / type article, color, size…" onkeydown="if(event.key==='Enter')qa()" oninput=qs() autocomplete=off><div id=qr></div></div><div class=card><h3>Cart</h3><div id=cart></div></div></div>
<div class=card><h3>Bill</h3><label>Customer</label><select id=pc><option value="">Walk-in / new</option>${D.customers.map(c=>`<option value="${c.id}">${esc(c.name)} ${esc(c.phone)} ${esc(c.city||'')}</option>`).join('')}</select><div class=r><input id=pn placeholder="New name"><input id=pp placeholder="Phone"><input id=pcity placeholder="City (optional)"></div>
<label>Bill discount (₹)</label><input id=dc type=number value="${C.disc||''}" oninput="C.disc=+this.value;drawCart()"><div id=tot></div><label>Payments (split allowed; remainder = credit)</label><div class=r><input id=pc1 type=number placeholder="Cash"><input id=pu type=number placeholder="UPI"><input id=pcd type=number placeholder="Card"></div>
<button class=b2 onclick="$('#pc1').value=calc().total">Full cash</button> <button onclick=co()>Confirm &amp; save bill</button></div></div>`;
H.pos=()=>{drawCart();$('#q').focus()};
function calc(){const lines=C.cart.map(c=>{const v=V(c.sku),p=P(v.pid);return{sku:c.sku,pid:p.id,code:p.code,name:p.name,color:v.color,size:v.size,qty:c.qty,price:p.price,cost:p.cost,gst:p.gst,amt:p.price*c.qty}}),sub=sum(lines,l=>l.amt),disc=Math.min(+C.disc||0,sub),r=sub?disc/sub:0;let tx=0;lines.forEach(l=>{l.net=l.amt*(1-r);l.tx=l.net/(1+l.gst/100);tx+=l.tx});const raw=sub-disc,total=Math.round(raw);return{lines,sub,disc,taxable:tx,gst:raw-tx,round:total-raw,total,profit:tx-sum(lines,l=>l.cost*l.qty)}}
function qs(){const q=$('#q').value.trim().toLowerCase();if(!q){$('#qr').innerHTML='';return}const t=q.split(/\s+/);$('#qr').innerHTML=D.variants.filter(v=>{const p=P(v.pid),h=(v.sku+' '+p.name+' '+p.brand+' '+v.color+' size'+v.size+' '+v.size).toLowerCase();return t.every(x=>h.includes(x))}).slice(0,8).map(v=>`<div class=hit onclick="as('${esc(v.sku)}')"><span>${esc(v.sku)} · ${esc(P(v.pid).name)} · ${esc(v.color)} · ${esc(v.size)}</span><b>${v.qty} in stock</b></div>`).join('')||'<p class=mu>No match</p>'}
function qa(){const q=$('#q').value.trim().toLowerCase(),v=D.variants.find(v=>v.sku.toLowerCase()===q);if(v)as(v.sku);else toast('Unknown code: '+q,1)}
function as(sku){const v=V(sku),c=C.cart.find(x=>x.sku===sku),n=(c?c.qty:0)+1;if(n>v.qty)return toast('Only '+v.qty+' in stock for '+sku,1);c?c.qty=n:C.cart.push({sku,qty:1});$('#q').value='';$('#qr').innerHTML='';drawCart();$('#q').focus()}
function cq(i,d){const c=C.cart[i],n=c.qty+d;if(n<1)C.cart.splice(i,1);else if(n>V(c.sku).qty)return toast('Insufficient stock',1);else c.qty=n;drawCart()}
function drawCart(){const b=calc();$('#cart').innerHTML=tb(['Item','Qty','Price','Amount',''],b.lines.map((l,i)=>[esc(l.code+' '+l.name+' · '+l.color+' · '+l.size),`<button class="sm b2" onclick=cq(${i},-1)>-</button> ${l.qty} <button class="sm b2" onclick=cq(${i},1)>+</button>`,fm(l.price),fm(l.amt),`<button class="sm bd" onclick="C.cart.splice(${i},1);drawCart()">×</button>`]));
$('#tot').innerHTML=`<p class=mu>Subtotal ${fm(b.sub)} · Discount ${fm(b.disc)} · Taxable ${fm(b.taxable)} · GST ${fm(b.gst)} · Round ${fm(b.round)}</p><div class=kv>Total ${fm(b.total)}</div>`}
function co(){if(busy)return;const b=calc();if(!b.lines.length)return toast('Cart is empty',1);for(const l of b.lines)if(V(l.sku).qty<l.qty)return toast('Insufficient stock: '+l.sku,1);
const pays=[['Cash','pc1'],['UPI','pu'],['Card','pcd']].map(([m,i])=>({m,a:+$('#'+i).value||0})).filter(p=>p.a>0),paid=sum(pays,p=>p.a);if(paid>b.total)return toast('Paid exceeds total',1);const due=b.total-paid;
let cid=$('#pc').value;const nm=$('#pn').value.trim(),ph=$('#pp').value.trim();if(due>0&&!cid&&!(nm||ph))return toast('Customer needed for credit / partial bills',1);
busy=1;if(!cid&&(nm||ph)){const c={id:id(),name:nm||ph,phone:ph,city:$('#pcity').value.trim(),gstin:'',address:''};D.customers.push(c);cid=c.id}const cu=D.customers.find(c=>c.id===cid);D.inv++;const no='INV-'+String(D.inv).padStart(5,'0');
const s={id:id(),no,date:td(),cid,cname:cu?cu.name:'Walk-in',cgstin:cu?cu.gstin||'':'',lines:b.lines,sub:b.sub,disc:b.disc,taxable:b.taxable,gst:b.gst,round:b.round,total:b.total,pays,paid,due,profit:b.profit};
D.sales.unshift(s);b.lines.forEach(l=>mv(l.sku,-l.qty,'Sale',no));if(due>0)D.ledger.push({cid,date:td(),amt:due,note:'Credit on '+no});C={cart:[],disc:0};save();busy=0;render();showInv(s.id)}

function svx(i){D.suppliers=D.suppliers.filter(s=>s.id!==i);save();cm();render()}
function sva(sid,eid){const s=D.suppliers.find(x=>x.id===sid);s.articles=s.articles||[];AE=eid||null;const e=s.articles.find(a=>a.id===eid)||{};
modal(`<h3>Articles supplied by ${esc(s.name)}</h3>${tb(['Source','Code','Name',''],s.articles.map(a=>{const p=a.pid&&P(a.pid);return[p?'Catalog':'Manual',esc(p?p.code:a.code),esc(p?p.name:a.name),`<button class="sm b2" onclick="sva('${sid}','${a.id}')">Edit</button> <button class="sm bd" onclick="svr('${sid}','${a.id}')">Remove</button>`]}))}<h3 style="margin-top:12px">${eid?'Edit':'Add'} article</h3><label>Link existing catalog article</label><select id=aa onchange=asel()><option value="">- Enter manually -</option>${D.products.map(p=>`<option value="${p.id}" ${p.id===e.pid?'selected':''}>${esc(p.code+' - '+p.name)}</option>`).join('')}</select><div class=r><input id=ac placeholder="Article code" value="${esc(e.pid?'':e.code)}"><input id=an placeholder="Article name" value="${esc(e.pid?'':e.name)}"></div><button onclick="sas('${sid}')">${eid?'Save changes':'Add article'}</button>`);asel()}
function asel(){$('#ac').disabled=$('#an').disabled=!!$('#aa').value}
function sas(sid){const s=D.suppliers.find(x=>x.id===sid),pid=$('#aa').value,p=pid&&P(pid),code=p?p.code:$('#ac').value.trim(),name=p?p.name:$('#an').value.trim();if(!code&&!name)return toast('Enter an article name/code or link a catalog article',1);
if(s.articles.some(a=>a.id!==AE&&(pid?a.pid===pid:!a.pid&&a.code.toLowerCase()===code.toLowerCase()&&a.name.toLowerCase()===name.toLowerCase())))return toast('Article already added for this vendor',1);
const r={id:AE||id(),pid:pid||'',code,name},i=s.articles.findIndex(a=>a.id===AE);i>=0?s.articles[i]=r:s.articles.push(r);save();render();sva(sid);toast('Saved')}
function svr(sid,aid){const s=D.suppliers.find(x=>x.id===sid);s.articles=s.articles.filter(a=>a.id!==aid);save();render();sva(sid)}
save();render();
</script></body></html>
